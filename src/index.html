
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red vs Blue</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scoreboard.css">
</head>

<body>
  <h1>Red vs Blue</h1>
<p id="team">Enter a username to play</p>
<p id="reset-countdown"></p>

<form id="usernameForm">
  <label for="usernameInput">Username</label>
  <input id="usernameInput" type="text" maxlength="20" autocomplete="off" required autofocus>
  <button id="usernameSubmit" type="submit">Join</button>
  <p id="usernameError"></p>
</form>

<main id="gameArea" hidden>
    <!-- Peyton's scoreboard -->
  <section class="sb" id="scoreboard" aria-label="Scoreboard">
    <div class="sb-scores">
      <div class="sb-team sb-team--red">
        <span class="sb-name">Red</span>
        <span class="sb-score" id="sb-red-score">0</span>
      </div>

      <div class="sb-team sb-team--blue">
        <span class="sb-name">Blue</span>
        <span class="sb-score" id="sb-blue-score">0</span>
      </div>
    </div>

    <div class="sb-bar" aria-hidden="true">
      <div class="sb-bar-red" id="sb-bar-red"></div>
    </div>

    <p class="sb-timer" id="sb-timer">Loading scores...</p>
  </section>

  <!-- Capture button -->
  <div class="button-base">
    <button id="captureButton" type="button" disabled>
      CAPTURE
    </button>
  </div>

  <p id="gameStatus">Waiting for game state...</p>
</main>

  <!-- One active contest per flag; only the participants see the choices. -->
  <div id="rpsOverlay" class="rps-overlay" hidden>
    <section class="rps-card" role="dialog" aria-modal="true" aria-labelledby="rpsTitle">
      <div class="rps-kicker">BUTTON CONTEST</div>
      <h2 id="rpsTitle">Rock • Paper • Scissors</h2>
      <p id="rpsOpponent"></p>
      <div class="rps-clock" id="rpsClock" aria-live="off"></div>
      <p id="rpsFeedback" role="status" aria-live="polite"></p>
      <div class="rps-choices" id="rpsChoices">
        <button type="button" data-rps-move="rock"><span aria-hidden="true">✊</span>Rock</button>
        <button type="button" data-rps-move="paper"><span aria-hidden="true">✋</span>Paper</button>
        <button type="button" data-rps-move="scissors"><span aria-hidden="true">✌️</span>Scissors</button>
      </div>
      <button type="button" id="rpsDismiss" hidden>Back to game</button>
    </section>
  </div>

  <script src="rps-ui.js"></script>
  <script src="scoreboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
