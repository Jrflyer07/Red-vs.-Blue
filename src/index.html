
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red vs Blue</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scoreboard.css">
</head>

<body>
  <h1>Red vs Blue</h1>
<p id="team">Enter a username to play</p>

<form id="usernameForm">
  <label for="usernameInput">Username</label>
  <input id="usernameInput" type="text" maxlength="20" autocomplete="off" required autofocus>
  <button id="usernameSubmit" type="submit">Join</button>
  <p id="usernameError"></p>
</form>

<main id="gameArea" hidden>
    <!-- Peyton's scoreboard -->
  <section class="sb" id="scoreboard" aria-label="Scoreboard">
    <div class="sb-scores">
      <div class="sb-team sb-team--red">
        <span class="sb-name">Red</span>
        <span class="sb-score" id="sb-red-score">0</span>
      </div>

      <div class="sb-team sb-team--blue">
        <span class="sb-name">Blue</span>
        <span class="sb-score" id="sb-blue-score">0</span>
      </div>
    </div>

    <div class="sb-bar" aria-hidden="true">
      <div class="sb-bar-red" id="sb-bar-red"></div>
    </div>

    <p class="sb-timer" id="sb-timer">Loading scores...</p>
  </section>

  <!-- Capture button -->
  <div class="button-base">
    <button id="captureButton" type="button" disabled>
      CAPTURE
    </button>
  </div>

  <p id="gameStatus">Waiting for game state...</p>

  <section id="playerStats" aria-label="Your stats">
    <h2>Your Stats</h2>
    <dl>
      <div class="stat">
        <dt>Captures</dt>
        <dd id="statCaptures">0</dd>
      </div>
      <div class="stat">
        <dt>Time held</dt>
        <dd id="statHeld">0s</dd>
      </div>
    </dl>
  </section>

  <section id="devPanel" aria-label="Dev panel" hidden>
    <h2>Dev Panel</h2>
    <label for="devKeyInput">Dev key</label>
    <input id="devKeyInput" type="password" autocomplete="off">
    <div class="dev-actions">
      <button id="devKickButton" type="button">Kick off button</button>
      <button id="devResetButton" type="button">Reset game</button>
    </div>
    <p id="devStatus"></p>
  </section>
</main>

  <script src="scoreboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
